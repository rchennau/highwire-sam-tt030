# highwire.cfg — SAM TT030 fork default (installed as /opt/highwire/highwire.cfg by the highwire RPM, %config).
# HighWire reads $HOME/defaults/highwire.cfg, then $HOME/highwire.cfg, then this file: a user file wins.
#
# TLS is terminated off the TT: sam-tt-tlsproxy on CT114, pinned as ttproxy.sam.int in /etc/hosts.
# https:// pages go out as plain "GET https://..." to it (HighWire has no TLS of its own).
HTTP_PROXY = ttproxy.sam.int:3128
#
# FHS: the cache lives under /var/cache, not beside the program in /opt.
CACHEDIR = U:\var\cache\highwire\
#
# Debugging: uncomment both, FIRST in the file, so everything after them is logged.
#LOGGING = 1
#LOG_FILE = /tmp/highwire.log
